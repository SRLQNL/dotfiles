format = """
$directory$git_branch$git_status$python$nodejs$rust$golang$docker_context\
$cmd_duration$line_break$character"""

add_newline = true

[character]
success_symbol = "[❯](bold #a277ff)"
error_symbol = "[❯](bold #ff6767)"
vimcmd_symbol = "[❮](bold #61ffca)"

[directory]
style = "bold #61ffca"
truncation_length = 3
truncate_to_repo = true
read_only = " "

[git_branch]
symbol = " "
style = "bold #a277ff"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold #ff6767"
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇡${ahead_count}⇣${behind_count}"
untracked = "?"
modified = "!"
staged = "+"
deleted = "✘"

[cmd_duration]
min_time = 2000
style = "bold #ffca85"
format = "took [$duration]($style) "

[python]
symbol = " "
style = "bold #61ffca"
format = '[$symbol($version)]($style) '

[nodejs]
symbol = " "
style = "bold #61ffca"

[rust]
symbol = " "
style = "bold #ff6767"

[golang]
symbol = " "
style = "bold #61ffca"

[docker_context]
symbol = " "
style = "bold blue"

[memory_usage]
disabled = true

[package]
disabled = true
