# Performance tuning
vm.swappiness = 5
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5

# rp_filter=2 (loose mode): required for WireGuard/AmneziaVPN, which routes
# packets through a virtual interface with a different source address than the
# one the packet arrived on. Strict mode (1) would drop these packets.
# On machines without WireGuard, strict mode (1) is marginally more secure,
# but loose mode is harmless and avoids breakage if VPN is added later.
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
