# Security hardening — applied on all machines
# See: https://kernel.org/doc/html/latest/admin-guide/sysctl/

# TCP TIME_WAIT attack prevention
net.ipv4.tcp_rfc1337 = 1

# Log packets with impossible source addresses
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# FIFO and regular file creation via symlinks in world-writable dirs
fs.protected_fifos = 2
fs.protected_regular = 2

# Hardlink and symlink restrictions (prevent /tmp races)
fs.protected_hardlinks = 1
fs.protected_symlinks = 1

# Disable core dumps
fs.suid_dumpable = 0
kernel.core_pattern = |/bin/false

# BPF JIT hardening
net.core.bpf_jit_harden = 2

# Disable unprivileged eBPF (common attack vector)
kernel.unprivileged_bpf_disabled = 1

# Restrict kernel pointer addresses from unprivileged users
kernel.kptr_restrict = 2

# Restrict access to perf events from unprivileged users
kernel.perf_event_paranoid = 3
