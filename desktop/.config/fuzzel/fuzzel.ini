font=Noto Sans Mono:size=13
terminal=foot -e
prompt="Search: "
icon-theme=Zafiro-Dark
icons-enabled=yes
filter-desktop=yes
match-mode=fzf
fields=name,generic,comment,categories,filename
layer=overlay
keyboard-focus=exclusive
width=42
lines=10
horizontal-pad=26
vertical-pad=14
inner-pad=8
line-height=24
image-size-ratio=1

[colors]
background=191724f2
text=e3c7fcff
prompt=bd93f9ff
placeholder=a8899cff
input=e3c7fcff
match=ff4971ff
selection=140a1dff
selection-text=e3c7fcff
selection-match=ff4971ff
border=bd93f9ff

[border]
width=2
radius=8
selection-radius=6

[key-bindings]
cancel=Escape Control+g Control+c Control+bracketleft
execute=Return KP_Enter
execute-or-next=none
execute-input=Shift+Return Shift+KP_Enter
cursor-left=Left Control+b
cursor-left-word=Control+Left Mod1+b
cursor-right=Right Control+f
cursor-right-word=Control+Right Mod1+f
cursor-home=Home
cursor-end=End Control+e
delete-line-backward=Control+u
delete-line-forward=Control+k
delete-line=Control+a Control+Shift+BackSpace
delete-prev=BackSpace Control+h
delete-prev-word=Control+BackSpace Control+w Mod1+BackSpace
delete-next=Delete
delete-next-word=Control+Delete Mod1+d
clipboard-paste=Control+v XF86Paste
primary-paste=Shift+Insert Shift+KP_Insert
prev=Up Control+p
prev-with-wrap=ISO_Left_Tab
prev-page=Page_Up KP_Page_Up
next=Down Control+n
next-with-wrap=Tab
next-page=Page_Down KP_Page_Down
first=Control+Home
last=Control+End
